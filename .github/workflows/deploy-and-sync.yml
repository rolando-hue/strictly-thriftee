name: Deploy Strictly Thriftee & Sync Depop

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 6 hours to sync new drops & sold items from Depop
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Depop Inventory Sync
        run: |
          node scripts/sync-depop.mjs

      - name: Commit Updated Inventory (if changed)
        run: |
          git config user.name "Strictly Thriftee Bot"
          git config user.email "bot@strictlythriftee.com"
          git add data/inventory.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update Depop inventory [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
