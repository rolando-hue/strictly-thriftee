name: Deploy Strictly Thriftee & Sync Depop

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 6 hours to sync new drops & sold items from Depop
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Depop Inventory Sync
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          if [ -n "$SCRAPER_API_KEY" ] || [ -n "$ZENROWS_API_KEY" ]; then
            python3 scripts/cloud_sync.py
          else
            echo "Notice: SCRAPER_API_KEY secret not found; falling back to timestamp sync."
            node scripts/sync-depop.mjs
          fi

      - name: Commit Updated Inventory (if changed)
        run: |
          git config user.name "Strictly Thriftee Bot"
          git config user.email "bot@strictlythriftee.com"
          git add data/inventory.json index.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): automated Depop cloud sync and SEO update [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
